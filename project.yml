name: Timing
options:
  bundleIdPrefix: com.cwlsn
  deploymentTarget: { iOS: "26.1" }
configFiles: { Debug: Config/Base.xcconfig, Release: Config/Base.xcconfig }
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TimingCore: { path: Core }
targets:
  Timing:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).timing, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon } }
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Timing
        AppGroup: group.$(BUNDLE_PREFIX).timing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: Timing rings when your timers end, even in Silent mode or a Focus.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Timing.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).timing]
    dependencies: [{ target: TimingWidget }, { package: TimingCore }]
  TimingWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).timing.$(WIDGET_ID) } }
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Timing
        AppGroup: group.$(BUNDLE_PREFIX).timing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: Widget/TimingWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).timing]
    dependencies: [{ package: TimingCore }]
  TimingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).timing.uitests, GENERATE_INFOPLIST_FILE: true } }
    dependencies: [{ target: Timing }]
schemes:
  Timing:
    build: { targets: { Timing: all } }
    test: { targets: [TimingUITests] }
